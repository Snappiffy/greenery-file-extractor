[project]
name = "greenery-extractor"
version = "1.0.0"
description = "Stateless HTTP microservice that extracts structured rows from grower price lists"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "pymupdf>=1.24.0",
    "pdfplumber>=0.11.0",
    "httpx>=0.27.0",
    "pillow>=10.4.0",
    "pytesseract>=0.3.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "syrupy>=4.7.0",
    "hypothesis>=6.115.0",
    "types-Pillow>=10.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/extractor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "golden: usa fixtures de documentos reales",
    "slow: tarda más de un segundo",
    "ocr: requiere el binario tesseract",
]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "B008",  # FastAPI Depends() in defaults is the idiomatic pattern
]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["extractor"]
plugins = ["pydantic.mypy"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "fitz",
]
ignore_missing_imports = true

[tool.coverage.run]
source = ["src/extractor"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
